repositories {
    // CleanroomGradle supplies CleanroomMC, Mojang and Maven Central.
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = 'CleanroomCurseMaven'; url = 'https://curse.cleanroommc.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'BuildCraft'; url = 'https://mod-buildcraft.com/maven' }
    exclusiveContent {
        forRepository { maven { name = 'CleanroomHEI'; url = 'https://maven.cleanroommc.com' } }
        filter { includeGroup 'mezz' }
    }
    if (providers.gradleProperty('cg.repos.enableLocal').orElse('false').get().toBoolean()) mavenLocal()
    if (providers.gradleProperty('quarryplus_dev_jar').isPresent()) {
        flatDir { dirs file(providers.gradleProperty('quarryplus_dev_jar').get()).parentFile }
    }
}

dependencies {
    implementation deobf('mezz:jei:4.35.0@jar')
    implementation(deobf('com.cleanroommc:modularui:3.1.6')) { transitive = false }
    compileOnly(deobf('curse.maven:inventory-bogosorter-632327:7412409')) { transitive = false }
    compileOnly(deobf('curse.maven:neverenoughanimation-1062347:6533650')) { transitive = false }
    // Both machine integrations remain optional. Standalone runs omit BuildCraft too.
    if (providers.gradleProperty('marker_standalone').getOrElse('false').toBoolean()) {
        compileOnly deobf('com.mod-buildcraft:buildcraft-main:7.99.24.7')
    } else {
        implementation deobf('com.mod-buildcraft:buildcraft-main:7.99.24.7')
    }
    compileOnly(deobf('curse.maven:additional-enchanted-miner-282837:3851282')) { transitive = false }
    // Optional SRG distribution for testing QuarryPlus-Rescaled's IMarker integration.
    if (providers.gradleProperty('quarryplus_dev_jar').isPresent()) {
        def localJar = file(providers.gradleProperty('quarryplus_dev_jar').get())
        runtimeOnly deobf("local.integration:${localJar.name.replaceFirst(/\.jar$/, '')}:1@jar")
        runtimeOnly 'org.scala-lang:scala-library:3.9.0'
        runtimeOnly(deobf('curse.maven:scalar-1012168:8800375')) { transitive = false }
    }
}

// Geometry regression tests need Minecraft and the same remapped APIs as the Mod.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
}

// The old signed QuarryPlus jar retains obsolete signatures after SRG-to-MCP remapping.
// JUnit uses the normal JVM classloader, so extract a test-only copy without signing metadata.
// The original dependency, game runtime and distributable are left untouched.
if (enable_junit_testing.toBoolean()) {
    def quarryTestApi = sourceSets.main.compileClasspath.filter {
        it.name.contains('additional-enchanted-miner-282837') && it.name.endsWith('.jar')
    }
    def prepareQuarryTestApi = tasks.register('prepareQuarryTestApi', Sync) {
        from({ quarryTestApi.collect { zipTree(it) } })
        exclude 'META-INF/**'
        into layout.buildDirectory.dir('test-integration-api/quarryplus')
    }
    tasks.named('test') {
        dependsOn prepareQuarryTestApi
        classpath = classpath.minus(quarryTestApi).plus(files(prepareQuarryTestApi.map { it.destinationDir }))
    }
}
